<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151514" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Shopping">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Shopping list</title>
<style>
  :root {
    --bg: #f6f6f4; --card: #ffffff; --text: #1d1d1b; --muted: #77776f;
    --line: #e4e4df; --accent: #2e7d4f; --done: #a4a49c; --error: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514; --card: #201f1d; --text: #ecebe6; --muted: #9a9991;
      --line: #33322f; --accent: #5cbf85; --done: #6a6964; --error: #f2b8b5;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 17px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  header {
    position: sticky; top: 0; z-index: 2; background: var(--bg);
    padding: 12px 16px 10px; border-bottom: 1px solid var(--line);
  }
  h1 { font-size: 20px; margin: 0; }
  .meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .bar { height: 6px; background: var(--line); border-radius: 3px; margin-top: 8px; overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .tools { display: flex; gap: 8px; margin-top: 10px; }
  .tools button {
    flex: 1; font: inherit; font-size: 14px; padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--card); color: var(--text);
  }
  .tools #refresh { flex: 0 0 48px; font-size: 18px; padding: 4px 0; }
  .tools button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  .status { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .status:empty { display: none; }
  .status.error { color: var(--error); }
  main { padding: 4px 16px 40px; max-width: 640px; margin: 0 auto; }
  h2 {
    font-size: 13px; text-transform: uppercase; letter-spacing: .05em;
    color: var(--muted); margin: 18px 0 6px;
  }
  ul { list-style: none; margin: 0; padding: 0; background: var(--card);
       border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  li + li { border-top: 1px solid var(--line); }
  label { display: flex; align-items: center; gap: 12px; padding: 12px 14px; cursor: pointer; }
  input[type=checkbox] { width: 24px; height: 24px; flex: none; margin: 0; accent-color: var(--accent); }
  .name { flex: 1; }
  .amt { color: var(--muted); font-size: 15px; white-space: nowrap; }
  .dish { color: var(--muted); font-size: 13px; margin-left: 6px; opacity: .85; }
  input:checked ~ .name, input:checked ~ .amt { color: var(--done); text-decoration: line-through; }
  input:checked ~ .name .dish { color: var(--done); }
  body.hide-done li.done { display: none; }
  body.hide-done section.all-done { display: none; }
  .empty { color: var(--muted); font-style: italic; margin-top: 18px; }
  details { margin-top: 14px; background: var(--card); border: 1px solid var(--line);
            border-radius: 10px; padding: 10px 14px; }
  summary { font-weight: 600; cursor: pointer; }
  .meal { margin-top: 10px; }
  .meal-title { font-weight: 600; font-size: 15px; }
  .meal-ing { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<header>
  <h1>Shopping list</h1>
  <div class="meta"><span id="made">Loading…</span><span id="count"></span></div>
  <div class="bar"><div id="progress"></div></div>
  <div class="tools">
    <button type="button" id="hide" aria-pressed="false">Hide ticked</button>
    <button type="button" id="reset">Untick all</button>
    <button type="button" id="refresh" aria-label="Check for a new list">↻</button>
  </div>
  <div class="status" id="status"></div>
</header>
<main id="list"></main>
<script>
(function () {
  "use strict";
  var OWNER = "isabeau003", REPO = "boodschappen";
  var API_URL = "https://api.github.com/repos/" + OWNER + "/" + REPO + "/contents/list.json";
  var LIST_KEY = "mp-list", TICKS_PREFIX = "mp-ticks-";
  var main = document.getElementById("list");
  var hideBtn = document.getElementById("hide");
  var statusEl = document.getElementById("status");
  var list = null, ticks = {}, lastCheck = 0, checking = false;

  function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function setStatus(text, isError) {
    statusEl.textContent = text || "";
    statusEl.classList.toggle("error", !!isError);
  }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function saveTicks() {
    if (!list) return;
    ticks.__hide = document.body.classList.contains("hide-done") ? 1 : 0;
    store(TICKS_PREFIX + list.id, JSON.stringify(ticks));
  }
  function loadTicks() {
    ticks = {};
    try { ticks = JSON.parse(load(TICKS_PREFIX + list.id) || "{}") || {}; } catch (e) {}
    document.body.classList.toggle("hide-done", !!ticks.__hide);
    hideBtn.setAttribute("aria-pressed", ticks.__hide ? "true" : "false");
  }
  function forgetOldTicks() {
    try {
      for (var i = localStorage.length - 1; i >= 0; i--) {
        var k = localStorage.key(i);
        if (k && k.indexOf(TICKS_PREFIX) === 0 && k !== TICKS_PREFIX + list.id) localStorage.removeItem(k);
      }
    } catch (e) {}
  }

  function update() {
    var boxes = main.querySelectorAll("input[type=checkbox]"), done = 0;
    Array.prototype.forEach.call(boxes, function (b) {
      b.closest("li").classList.toggle("done", b.checked);
      if (b.checked) done++;
    });
    Array.prototype.forEach.call(main.querySelectorAll("section"), function (s) {
      var all = s.querySelectorAll("input"), ticked = s.querySelectorAll("input:checked");
      s.classList.toggle("all-done", all.length > 0 && all.length === ticked.length);
    });
    document.getElementById("count").textContent = !list ? "" :
      " · " + (boxes.length ? (done + " / " + boxes.length + " in cart") : "nothing to buy");
    document.getElementById("progress").style.width =
      !list ? "0" : (boxes.length ? (100 * done / boxes.length) + "%" : "100%");
  }

  function render() {
    main.textContent = "";
    if (!list) {
      document.getElementById("made").textContent = "No list yet";
      main.appendChild(el("p", "empty", "No shopping list yet. In the Meal Planner, press “Send to Phone”."));
      update();
      return;
    }
    loadTicks();
    document.getElementById("made").textContent = "Made " + (list.made || "");
    var meals = list.meals || [];
    if (meals.length) {
      var det = el("details");
      det.appendChild(el("summary", null, "Meals in this plan"));
      meals.forEach(function (m) {
        var d = el("div", "meal");
        d.appendChild(el("div", "meal-title", m.title));
        d.appendChild(el("div", "meal-ing", m.ingredients || "(no ingredients recorded)"));
        det.appendChild(d);
      });
      main.appendChild(det);
    }
    var cats = list.categories || [];
    if (!cats.length) main.appendChild(el("p", "empty", "(you already have everything you need)"));
    cats.forEach(function (cat) {
      var sec = el("section"), ul = el("ul");
      sec.appendChild(el("h2", null, cat.name));
      (cat.items || []).forEach(function (it) {
        var li = el("li"), lab = el("label"), box = el("input");
        box.type = "checkbox";
        box.checked = !!ticks[it.key];
        box.addEventListener("change", function () {
          if (box.checked) ticks[it.key] = 1; else delete ticks[it.key];
          update(); saveTicks();
        });
        lab.appendChild(box);
        var nameEl = el("span", "name", it.name);
        if (it.dishes && it.dishes.length) nameEl.appendChild(el("span", "dish", it.dishes.join(", ")));
        lab.appendChild(nameEl);
        lab.appendChild(el("span", "amt", it.amount || ""));
        li.appendChild(lab);
        ul.appendChild(li);
      });
      sec.appendChild(ul);
      main.appendChild(sec);
    });
    update();
  }

  function fetchJson(url, headers) {
    var ctrl = window.AbortController ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, 10000) : null;
    return fetch(url, { cache: "no-store", headers: headers || {}, signal: ctrl ? ctrl.signal : undefined })
      .then(function (r) {
        if (timer) clearTimeout(timer);
        if (r.status === 404) return null;          // nothing sent yet
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      });
  }

  function check(manual) {
    if (checking) return;
    checking = true;
    lastCheck = Date.now();
    setStatus("Checking for a new list…");
    // GitHub API first (updated within seconds), the Pages copy as fallback.
    fetchJson(API_URL, { "Accept": "application/vnd.github.raw+json" })
      .catch(function () { return fetchJson("list.json?t=" + Date.now()); })
      .then(function (data) {
        if (data && data.id && (!list || data.id !== list.id)) {
          var hadList = !!list;
          list = data;
          store(LIST_KEY, JSON.stringify(data));
          forgetOldTicks();
          render();
          setStatus(hadList ? "New list loaded." : "");
        } else {
          if (!list) render();
          setStatus(manual ? "Up to date." : "");
        }
      })
      .catch(function () {
        if (!list) render();
        setStatus(list ? "Offline – showing the last list you opened."
                       : "Couldn’t load the list. Check your connection and tap ↻.", !list);
      })
      .then(function () { checking = false; });
  }

  hideBtn.addEventListener("click", function () {
    var on = document.body.classList.toggle("hide-done");
    hideBtn.setAttribute("aria-pressed", on ? "true" : "false");
    saveTicks();
  });
  document.getElementById("reset").addEventListener("click", function () {
    if (!list || !confirm("Untick all items?")) return;
    ticks = { __hide: ticks.__hide };
    Array.prototype.forEach.call(main.querySelectorAll("input[type=checkbox]"),
                                 function (b) { b.checked = false; });
    update(); saveTicks();
  });
  document.getElementById("refresh").addEventListener("click", function () { check(true); });
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && Date.now() - lastCheck > 30000) check(false);
  });

  try { list = JSON.parse(load(LIST_KEY) || "null"); } catch (e) { list = null; }
  if (list) render();
  check(false);
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});
})();
</script>
</body>
</html>
